<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stint planner (online.v1)</title>
<style>
:root{--bg:#f6f6f3;--fg:#16181a;--mut:#6b7075;--card:#fff;--bd:#d9dad5;--go:#12803a;--bad:#c0262d}
@media (prefers-color-scheme:dark){:root{--bg:#101214;--fg:#eceeef;--mut:#8d9499;--card:#191c1f;--bd:#2c3135;--go:#4cd17f;--bad:#ff6b70}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:30rem;padding:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:20px}
h1{font-size:22px;margin:0 0 4px}p{margin:0 0 14px;color:var(--mut)}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:10px}
button{font:inherit;font-weight:600;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;padding:10px 14px;cursor:pointer;min-height:42px;margin:10px 8px 0 0}
button.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.5}
input:focus-visible,button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
code{display:block;word-break:break-all;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:8px 10px;font:13px ui-monospace,Menlo,Consolas,monospace;color:var(--fg)}
.msg{margin-top:14px;font-size:14px;min-height:1.4em}.msg.bad{color:var(--bad)}.msg.ok{color:var(--go)}
[hidden]{display:none!important}
</style></head><body><main><div class="card">
<h1>Stint planner</h1>
<p>online.v1 · sign-in</p>

<div id="out">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email" inputmode="email" placeholder="you@example.com">
  <button id="send" class="p">Email me a sign-in link</button>
</div>

<div id="in" hidden>
  <label>Signed in as</label>
  <code id="who"></code>
  <label style="margin-top:12px">Your user ID</label>
  <code id="uid"></code>
  <button id="copy">Copy user ID</button>
  <button id="chk" class="p">Check access</button>
  <button id="bye">Sign out</button>
</div>

<div id="msg" class="msg" role="status" aria-live="polite"></div>
</div></main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
const sb = createClient('https://yvlpuoaciqzmuysvkhot.supabase.co', 'sb_publishable_yS2fz2alWEpVl14YcpZqhg_QV1LLVyG');
const $ = id => document.getElementById(id);
const say = (t, cls = '') => { $('msg').textContent = t; $('msg').className = 'msg ' + cls; };

function show(session) {
  $('out').hidden = !!session;
  $('in').hidden = !session;
  if (session) { $('who').textContent = session.user.email; $('uid').textContent = session.user.id; }
}
sb.auth.onAuthStateChange((_e, s) => show(s));
try { const { data } = await sb.auth.getSession(); show(data.session); }
catch (e) { say('Could not reach the sign-in service: ' + e.message, 'bad'); }

$('send').onclick = async () => {
  const email = $('email').value.trim();
  if (!email) { say('Enter your email first.', 'bad'); return; }
  $('send').disabled = true; say('Sending…');
  const { error } = await sb.auth.signInWithOtp({
    email, options: { emailRedirectTo: location.origin + location.pathname }
  });
  $('send').disabled = false;
  if (error) say(error.message, 'bad');
  else say('Check your email for the sign-in link, then open it on this device.', 'ok');
};

$('copy').onclick = async () => {
  try { await navigator.clipboard.writeText($('uid').textContent); say('User ID copied.', 'ok'); }
  catch (e) { say('Copy failed. Select the user ID above and copy it by hand.', 'bad'); }
};

$('chk').onclick = async () => {
  const { data, error } = await sb.rpc('is_owner');
  if (error) say(error.message, 'bad');
  else if (data) say('Access: you are the owner. The data is unlocked for you.', 'ok');
  else say('Access: signed in, but not the owner yet, so the data stays locked.');
};

$('bye').onclick = async () => { await sb.auth.signOut(); say('Signed out.'); };
</script></body></html>
